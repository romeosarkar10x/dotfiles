map ctrl+enter toggle_fullscreen

font_family MonoLisa
disable_ligatures always
font_features MonoLisa -liga -calt -dlig -rlig
font_features MonoLisaNormal-SemiBold -liga -calt -dlig -rlig
font_features MonoLisaItalic-SemiBold -liga -calt -dlig -rlig

font_size 12
linux_display_server wayland
shell_integration disabled
